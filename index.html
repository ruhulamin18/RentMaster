<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>House Rent Calculator & Receipt Pro</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Plus Jakarta Sans", "Hind Siliguri", sans-serif;
        background: linear-gradient(135deg, #f0f4ff 0%, #e0e7ff 100%);
        min-height: 100vh;
        margin: 0;
      }

      .receipt-paper {
        background-color: #fff;
        background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
        background-size: 20px 20px;
        position: relative;
      }

      .receipt-paper::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: repeating-linear-gradient(
          90deg,
          #4f46e5,
          #4f46e5 20px,
          #ffffff 20px,
          #ffffff 40px
        );
      }

      @media print {
        body {
          background: white !important;
          padding: 0 !important;
          margin: 0 !important;
        }

        .no-print {
          display: none !important;
        }

        #receipt-section {
          box-shadow: none !important;
          border: 1px solid #eee !important;
          margin: 0 !important;
          width: 100% !important;
          max-width: none !important;
          visibility: visible !important;
          position: absolute;
          left: 0;
          top: 0;
        }

        #root > :not(main),
        main > :not(.receipt-container) {
          display: none !important;
        }
      }

      .input-focus-ring {
        transition: all 0.2s ease-in-out;
      }

      .input-focus-ring:focus {
        transform: translateY(-1px);
        box-shadow: 0 4px 12px -2px rgba(79, 70, 229, 0.2);
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }

      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/index.tsx"></script>
  </body>
</html>
